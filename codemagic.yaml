# Codemagic CI/CD — builds the iOS app on a cloud Mac and publishes to
# App Store Connect (TestFlight). No local Mac required.
#
# Before the first run, in the Codemagic UI you must:
#   1. Connect this Git repository.
#   2. Add your App Store Connect API key under Teams/Settings → Integrations →
#      "App Store Connect", and give it a reference name (used below as
#      "codemagic_app_store").
#   3. Make sure the app record exists in App Store Connect with bundle id
#      com.trustinghand.app, and put its numeric Apple ID in APP_STORE_APPLE_ID.

workflows:
  ios-release:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic_app_store   # <-- name of your API key in Codemagic
    environment:
      groups:
        - code_signing   # <-- must contain CERTIFICATE_PRIVATE_KEY (the persistent signing key)
      vars:
        APP_STORE_APPLE_ID: 6804291546          # your app's numeric Apple ID
        BUNDLE_ID: "com.trustinghand.app"
      # Apple requires apps to be built with the iOS 26 SDK (Xcode 26+).
      # "latest" gives the newest Xcode on Codemagic; stable Flutter supports it.
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Add GoogleService-Info.plist to Xcode project
        script: |
          cd ios
          gem install xcodeproj --no-document
          ruby add_firebase_plist.rb
      - name: Set up code signing
        script: |
          set -e
          keychain initialize

          # Earlier failed builds may have left iOS Distribution certificates in
          # the Apple account whose private keys are gone (each build machine is
          # wiped afterwards). Apple limits how many distribution certificates
          # you can have, so delete the stale ones to guarantee we can create a
          # fresh, valid certificate this build.
          echo "=== Removing existing certificates (stale ones from earlier builds have no private key) ==="
          for CID in $(app-store-connect certificates list --json 2>/dev/null | jq -r '.[].id // empty'); do
            echo "Deleting certificate $CID"
            app-store-connect certificates delete "$CID" || true
          done

          # Create a fresh distribution certificate (its private key lives on
          # THIS machine for THIS build) plus the App Store provisioning profile.
          echo "=== Creating certificate + provisioning profile ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

          keychain add-certificates

          echo "=== Valid codesigning identities now in the keychain ==="
          security find-identity -v -p codesigning

          xcode-project use-profiles
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Send builds to TestFlight for testing first:
        submit_to_testflight: true
        # Set to true later, when you're ready to push to the public App Store:
        submit_to_app_store: false
